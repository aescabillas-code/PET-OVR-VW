services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - pet_mongo:/data/db

  api:
    build: .
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: pet_station
      PET_API_TOKEN: ${PET_API_TOKEN:-}
      PET_CORS_ORIGINS: ${PET_CORS_ORIGINS:-*}
    depends_on: [mongo]
    ports: ["8000:8000"]

  web:
    build: .
    restart: unless-stopped
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      # address of the API as the browser reaches it (change for a real host name)
      PET_API_URL: ${PET_API_URL:-http://localhost:8000}
      PET_API_TOKEN: ${PET_API_TOKEN:-}
      PET_APP_PASSWORD: ${PET_APP_PASSWORD:-}
    depends_on: [api]
    ports: ["8501:8501"]

volumes:
  pet_mongo:
